name: "bisonn"
namespace: "waggle"
version: "0.1.1"
description: "Biotic Interactions with Sage Observations using Neural Networks — bird mobbing behavior classifier + zero-shot species ID (BioCLIP 2.5 + Linear SVM)"
authors: "Kyle Lima"
collaborators: ""
funding: ""
license: "MIT"
keywords: "biotic,interaction,mobbing,bioclip,bird,behavior,classification,species,identification"
homepage: "https://github.com/Kylelima21/BISONN"
source:
    architectures:
        - "linux/arm64"
    url: "https://github.com/Kylelima21/BISONN"
    branch: "main"
inputs:
    - id: "stream"
      type: "string"
    - id: "snapshot-url"
      type: "string"
    - id: "image-dir"
      type: "string"
    - id: "continuous"
      type: "boolean"
    - id: "interval"
      type: "int"
    - id: "classifier"
      type: "string"
    - id: "upload-image"
      type: "boolean"
metadata:
  ontology: biotic.interaction.*,biotic.species.*
